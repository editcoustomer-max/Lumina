# Lumina Configuration File

# Dataset Configuration
dataset:
  data_dir: "datasets/"
  seq_length: 512
  shuffle: true
  train_split: 0.9

# Tokenizer Configuration
tokenizer:
  type: "character"  # character or bpe
  vocab_size: 256
  save_tokenizer: true

# Model Configuration
model:
  vocab_size: 256
  embedding_dim: 256
  num_heads: 8
  num_layers: 6
  ff_dim: 1024
  max_seq_length: 512
  dropout: 0.1

# Training Configuration
training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 100
  gradient_clip: 1.0

# Checkpointing Configuration
checkpointing:
  checkpoint_dir: "checkpoints/"
  save_interval: 1

# Logging Configuration
logging:
  level: "INFO"
  log_file: "logs/training.log"
  log_interval: 10
